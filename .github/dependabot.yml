version: 2

# Group updates so Dependabot opens fewer, easier-to-review PRs.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "main"
    schedule:
      # Weekly on Mondays at 08:23 UTC (off the :00/:30 hot path).
      interval: "weekly"
      day: "monday"
      time: "08:23"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "npm"
    # Cap open PRs to keep the queue manageable.
    open-pull-requests-limit: 10
    # Keep PRs in sync with the base branch automatically.
    rebase-strategy: "auto"
    # Group patch + minor updates; majors stay as standalone PRs.
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    # Avoid noisy bumps for heavy/native modules where major upgrades are risky.
    ignore:
      - dependency-name: "puppeteer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "three"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-three/fiber"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@react-three/drei"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
      include: "scope"
