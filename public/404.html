<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Lab Manager</title>
    <script>
      // GitHub Pages SPA redirect.
      // Encodes the full path into a query param, then index.html
      // picks it up and restores the URL via history.replaceState.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + 1).join('/') + '/?p=' +
        encodeURIComponent(l.pathname.slice(1) + (l.search ? '&' + l.search.slice(1) : '') + l.hash)
      );
    </script>
  </head>
  <body></body>
</html>
