services:
  # Web Service
  - type: web
    name: lab-manager
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
    buildFilter:
      paths:
        - src/**
        - server/**
        - package.json
        - package-lock.json
        - vite.config.ts
        - tsconfig.json
    autoDeploy: true
